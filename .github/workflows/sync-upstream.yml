name: Sync upstream main

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'EPasini1/BitChord'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    outputs:
      updated: ${{ steps.sync.outputs.updated }}
      head_sha: ${{ steps.sync.outputs.head_sha }}
    steps:
      - name: Check branch publishing credentials
        env:
          SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Set UPSTREAM_SYNC_TOKEN to a fine-grained PAT for this fork with Contents and Workflows write permissions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: ./.github/actions/require-custom-desktop

      - name: Test synchronization safeguards
        run: node --test .github/scripts/sync-upstream.test.cjs

      - name: Prepare and publish synchronization branch
        id: sync
        run: node .github/scripts/sync-upstream.cjs --apply --push

      - name: Open or update review PR
        if: steps.sync.outputs.updated == 'true'
        uses: actions/github-script@v7
        env:
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          HEAD_SHA: ${{ steps.sync.outputs.head_sha }}
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const head = process.env.SYNC_BRANCH;
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: process.env.HEAD_SHA,
              context: 'Upstream sync / validation',
              state: 'pending', description: 'Validating the synchronized commit.', target_url: runUrl,
            });
            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', base: 'main', head: `${owner}:${head}`,
            });
            const body = [
              'Merge updates from `kushagrasinghx/BitChord:main` while preserving the fork customizations.',
              '',
              `Upstream commit: \`${process.env.UPSTREAM_SHA}\`.`,
              '',
              'The synchronization uses normal Git merges, never an ours/theirs override or a force push.',
              'Review desktop UI changes and wait for `Upstream sync / validation` before merging. Do not squash or rebase',
              'this PR: use a merge commit to retain the upstream ancestry for subsequent synchronizations.',
              '',
              `[Validation run](${runUrl}).`,
            ].join('\n');
            const details = { owner, repo, title: 'chore: sync upstream main', body };
            const response = existing.data.length
              ? await github.rest.pulls.update({ ...details, pull_number: existing.data[0].number })
              : await github.rest.pulls.create({ ...details, head, base: 'main' });
            await core.summary.addHeading('Upstream synchronization')
              .addLink('Review the synchronization PR', response.data.html_url).write();

  validate:
    needs: sync
    if: needs.sync.outputs.updated == 'true'
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.sync.outputs.head_sha }}

  report-validation:
    needs: [sync, validate]
    if: always() && needs.sync.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ needs.sync.outputs.head_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const passed = process.env.VALIDATION_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner, repo, sha: process.env.HEAD_SHA,
              context: 'Upstream sync / validation',
              state: passed ? 'success' : 'failure',
              description: passed
                ? 'All synchronized-code checks passed.'
                : `Validation ${process.env.VALIDATION_RESULT}; do not merge.`,
              target_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
